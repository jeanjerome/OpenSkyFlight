<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSkyFlight — 3D Flight Simulator</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/main.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "three-tile": "./vendor/three-tile/packages/lib/dist/three-tile-osf.js",
      "@takram/three-geospatial": "./vendor/takram/three-geospatial/build/index.js",
      "@takram/three-geospatial/webgpu": "./vendor/takram/three-geospatial/build/webgpu.js",
      "@takram/three-atmosphere/webgpu": "./vendor/takram/three-atmosphere/build/webgpu.js",
      "stats.js": "https://esm.sh/stats.js@0.17.0"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <canvas id="hud"></canvas>
<div id="crosshair"></div>
  <div id="hires-badge" style="display:none;">HI-RES Z18</div>
  <div id="fly-hint" hidden>
    <span>Click to fly</span>
    <button id="menu-button" type="button">Menu&ensp;<kbd>Esc</kbd></button>
  </div>

  <div id="flightplan-menu" style="display:none;">
    <div class="fp-title">FLIGHT PLANS</div>
    <div id="flightplan-list"></div>
    <div class="fp-footer">L: close &nbsp;|&nbsp; 1-9: select &nbsp;|&nbsp; Esc: close</div>
  </div>

  <div id="minimap-container">
    <div id="minimap-header">
      <span>MAP</span>
      <div class="minimap-zoom-btns">
        <button id="minimap-zoom-out">&minus;</button>
        <button id="minimap-zoom-in">+</button>
      </div>
    </div>
    <canvas id="minimap" width="256" height="256"></canvas>
  </div>

  <div id="log-panel-container">
    <div id="log-panel-header">
      <span>LOG OUTPUT</span>
      <button id="log-panel-clear">CLEAR</button>
    </div>
    <div id="log-panel"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
